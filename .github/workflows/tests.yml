# Lint + unit tests on every push / PR (no secrets, no Postgres, no LLM).
# Integration tests skip themselves when Postgres is unreachable.
name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Unit tests
        run: uv run pytest tests/unit -q
