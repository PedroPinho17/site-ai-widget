# Full stack: docker compose up --build
# Database only: docker compose up -d db
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitewidget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sitewidget
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitewidget -d sitewidget"]
      interval: 5s
      timeout: 3s
      retries: 10

  clientdb:
    # Base de dados de demo do "cliente" (Mercearia Atlas). O widget só lê daqui.
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas_owner
      # ":-" e não ":?", para não partir os outros comandos do compose.
      # A imagem do Postgres recusa arrancar sem password, e o 02_readonly_user.sh também.
      POSTGRES_PASSWORD: ${CLIENTDB_PASSWORD:-}
      POSTGRES_DB: atlas
      ATLAS_READONLY_PASSWORD: ${ATLAS_READONLY_PASSWORD:-}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - clientdata:/var/lib/postgresql/data
      - ./demo/clientdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_owner -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sitewidget:${POSTGRES_PASSWORD}@db:5432/sitewidget
      UPLOAD_DIR: /app/data/uploads
      HF_HOME: /opt/hf
      # Reach the demo client DB by Docker DNS (host port 5436 maps to 5432 inside the network).
      CLIENTDB_ALLOWED_HOSTS: clientdb:5432
      # 1 = seed demo companies + PDFs before uvicorn starts (shell or .env)
      RUN_SEED: ${RUN_SEED:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Keep 127.0.0.1. Requests on this port reach the app from the Docker
      # bridge gateway, which is NOT trusted by default, so forwarding headers
      # are ignored and rate limits key on the gateway IP. Only set
      # TRUSTED_PROXY_IPS when a real proxy/tunnel is the sole way in.
      - "127.0.0.1:${APP_PORT:-8002}:8002"
    volumes:
      - uploads:/app/data/uploads
      - hf_cache:/opt/hf

volumes:
  pgdata:
  uploads:
  hf_cache:
  clientdata:
